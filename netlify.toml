[build]
  # Directory to change to before starting a build.
  # This is where we will look for package.json/.nvmrc/etc.
  base = "/"
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build.
  publish = "dist"
  
  # Command to generate the deploy-ready HTML files and assets.
  command = "npm run build"

[build.environment]
  # Specify Node.js version
  NODE_VERSION = "20"
  
  # Disable treating warnings as errors in CI environments to prevent random build failures
  CI = "false"

# SPA Fallback Routing
# This rule ensures that if you add React Router later, refreshing a page won't result in a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for static assets to ensure fast loading on Netlify Edge
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
